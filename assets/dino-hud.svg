<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset=".75" stop-color="#140a2e"/><stop offset="1" stop-color="#2a0d45"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffb627"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="900" height="300" rx="18"/></clipPath>
<clipPath id="sunclip"><rect x="0" y="0" width="900" height="252"/></clipPath>
<style>
text{font-family:"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace}
.title{font-size:24px;font-weight:700;fill:#e6f7ff;letter-spacing:2px}
.subt{font-size:13px;fill:#7dd3fc;letter-spacing:3px}
.status{font-size:12px;fill:#39ff9f;letter-spacing:2px}
.chip{fill:#0b1530;fill-opacity:.85;stroke:#22d3ee;stroke-opacity:.7}
.ck{font-size:10px;fill:#7dd3fc;letter-spacing:1.5px}
.cv{font-size:14px;font-weight:700;fill:#ffffff}
.dino{fill:#39ff9f}
.cac{fill:#ff2bd6}
.bug{font-size:11px;font-weight:700;fill:#ffb627;letter-spacing:1px}
.grid line{stroke:#ff2bd6;stroke-opacity:.35;stroke-width:1}
.ground{stroke:#22d3ee;stroke-width:2}
.cap{font-size:11px;fill:#a5b4fc;letter-spacing:2px}
.star{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.world{animation:scroll 9s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-900px)}}
.jumper{animation:jump 9s linear infinite}
@keyframes jump{0%{transform:translateY(0)}4.66%{transform:translateY(0)}4.67%{transform:translateY(0);animation-timing-function:ease-out}7.78%{transform:translateY(-78px);animation-timing-function:ease-in}10.89%{transform:translateY(0)}37.99%{transform:translateY(0)}38.00%{transform:translateY(0);animation-timing-function:ease-out}41.11%{transform:translateY(-78px);animation-timing-function:ease-in}44.22%{transform:translateY(0)}71.32%{transform:translateY(0)}71.33%{transform:translateY(0);animation-timing-function:ease-out}74.44%{transform:translateY(-78px);animation-timing-function:ease-in}77.56%{transform:translateY(0)}100%{transform:translateY(0)}}
.legA{animation:legA .24s steps(1) infinite}
.legB{animation:legB .24s steps(1) infinite}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
.dash{stroke:#22d3ee;stroke-width:2;stroke-dasharray:6 22;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.blink{animation:bl 1.2s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.scan{fill:#22d3ee;opacity:.06;animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(300px)}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="900" height="300" fill="url(#sky)"/>
<circle class="star" cx="40" cy="30" r="1.2" style="animation-delay:0s"/><circle class="star" cx="130" cy="80" r="1" style="animation-delay:1.2s"/><circle class="star" cx="260" cy="22" r="1.4" style="animation-delay:0.6s"/><circle class="star" cx="380" cy="60" r="1" style="animation-delay:2s"/><circle class="star" cx="470" cy="18" r="1.2" style="animation-delay:1.5s"/><circle class="star" cx="560" cy="95" r="1" style="animation-delay:0.3s"/><circle class="star" cx="610" cy="40" r="1.3" style="animation-delay:2.4s"/><circle class="star" cx="720" cy="70" r="1" style="animation-delay:1s"/><circle class="star" cx="800" cy="25" r="1.4" style="animation-delay:1.8s"/><circle class="star" cx="870" cy="110" r="1" style="animation-delay:0.9s"/><circle class="star" cx="330" cy="120" r="1" style="animation-delay:2.8s"/><circle class="star" cx="700" cy="140" r="1.2" style="animation-delay:0.2s"/>
