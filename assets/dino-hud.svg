rect class="cac" x="5" y="231" width="14" height="7" rx="2"/><text class="bug" x="0" y="200" text-anchor="middle">CORS</text></g><g transform="translate(1700,0)"><rect class="cac" x="-7" y="200" width="14" height="52" rx="3"/><rect class="cac" x="-19" y="214" width="8" height="20" rx="3"/><rect class="cac" x="-19" y="228" width="14" height="7" rx="2"/><rect class="cac" x="11" y="208" width="8" height="18" rx="3"/><rect class="cac" x="5" y="221" width="14" height="7" rx="2"/><text class="bug" x="0" y="190" text-anchor="middle">BROKEN PIPE</text></g></g>
