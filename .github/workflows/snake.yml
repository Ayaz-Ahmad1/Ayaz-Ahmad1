name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5b4b8a&color_dots=#efeaf9,#ddd2f7,#c9b8f0,#9f8bd6,#7a64c2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ece6fa&color_dots=#211b3d,#3d3266,#6b5aa6,#9f8bd6,#c9b8f0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
