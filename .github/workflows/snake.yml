name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8fd3c1&color_dots=#fbe4ec,#f7c8d8,#f4a7bb,#c9a3e0,#9f8bd6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8fd3c1&color_dots=#2a2140,#5b3f63,#a8728f,#f4a7bb,#fbe4ec

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
